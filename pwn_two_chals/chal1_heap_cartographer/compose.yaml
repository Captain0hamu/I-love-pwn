services:
  heap-cartographer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heap-cartographer
    working_dir: /home/pwn/work
    volumes:
      - .:/home/pwn/work
      - ${HOME}/.bashrc_pwn:/home/pwn/.host_bashrc:ro
      - ${HOME}/.tmux.conf:/home/pwn/.tmux.conf:ro
      - heap-cartographer-home:/home/pwn
    ports:
      - "1337:1337"
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: /bin/bash

volumes:
  heap-cartographer-home:
