services:
  fmt-lighthouse:
    build: .
    container_name: fmt-lighthouse-dev
    working_dir: /work
    volumes:
      - .:/work:rw
    ports:
      - "1338:1337"
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    environment:
      TERM: xterm-256color
    command: /bin/bash
