services:
  fmt-lighthouse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fmt-lighthouse
    working_dir: /work
    user: pwn
    volumes:
      - .:/work
      - ${HOME}/.bashrc_pwn:/home/pwn/.host_bashrc:ro
      - fmt-lighthouse-home:/home/pwn
    ports:
      - "1338:1337"
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: /bin/bash

volumes:
  fmt-lighthouse-home:
