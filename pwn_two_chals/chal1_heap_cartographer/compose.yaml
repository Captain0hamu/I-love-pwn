services:
  heap-cartographer:
    build: .
    container_name: heap-cartographer-dev
    working_dir: /work
    volumes:
      - .:/work:rw
    ports:
      - "1337:1337"
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    environment:
      TERM: xterm-256color
    command: /bin/bash
